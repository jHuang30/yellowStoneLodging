name: Check Yellowstone availability

on:
  schedule:
    # GitHub cron is best-effort and may be delayed under load. Every 15 min is
    # the practical floor — anything more frequent gets coalesced.
    - cron: "*/15 * * * *"
  workflow_dispatch:  # lets you run it on demand from the Actions tab

concurrency:
  # Skip a scheduled run if the previous one is still going.
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore state cache
        id: state-cache
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: monitor-state-v1
          restore-keys: |
            monitor-state-

      - name: Run monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python monitor.py

      - name: Save state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          # Each run uses a unique key (cache entries are immutable). The next
          # run's restore step picks the most recent matching restore-key.
          key: monitor-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
