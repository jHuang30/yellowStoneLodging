# Stay length (shared across all checks)
nights: 1

# Independent checks. Each fires its own notifications when a lodge has a
# room sized to fit the full party at base price < max_price.
checks:
  - name: family
    guests: {adults: 4, children: 2, infants: 0}
    max_price: 600
    watch:
      - YLOI  # Old Faithful Inn
      - YLOS  # Old Faithful Snow Lodge
      - YLOL  # Old Faithful Lodge Cabins
      - YLLH  # Lake Yellowstone Hotel
      - YLLL  # Lake Lodge Cabins
      - YLCL  # Canyon Lodge
      - YLMH  # Mammoth Hot Springs Hotel
      - YLGV  # Grant Village
      - YLRL  # Roosevelt Lodge Cabins
  - name: canyon-2p
    guests: {adults: 2, children: 0, infants: 0}
    max_price: 250
    watch:
      - YLCL  # Canyon Lodge
  - name: snow-4p
    guests: {adults: 4, children: 0, infants: 0}
    max_price: 250
    watch:
      - YLOS  # Old Faithful Snow Lodge

# Each window = one API call returning `limit` consecutive check-in dates.
# Date is ISO YYYY-MM-DD; must be in the future per the Xanterra API.
# (The API itself uses DD-MM-YYYY — we convert internally.)
windows:
  - date: "2026-06-20"
    limit: 31
  - date: "2026-07-21"
    limit: 31
  - date: "2026-08-21"
    limit: 10

# Lodge codes:
#   YLOI Old Faithful Inn   YLOS Old Faithful Snow Lodge  YLOL Old Faithful Lodge Cabins
#   YLLH Lake Yellowstone Hotel  YLLL Lake Lodge Cabins   YLCL Canyon Lodge
#   YLMH Mammoth Hot Springs Hotel  YLGV Grant Village    YLRL Roosevelt Lodge Cabins

# "any" = alert for any check-in date in the window.
# Or list specific dates: ["08/01/2026", "08/02/2026"]  (note: response uses MM/DD/YYYY)
target_dates: ["06/20/2026", "06/21/2026", "06/22/2026", "06/23/2026", "06/24/2026", "06/25/2026", "06/26/2026", "06/27/2026", "06/28/2026", "06/29/2026", "06/30/2026", "07/01/2026", "07/02/2026", "07/03/2026", "07/04/2026", "07/05/2026", "07/06/2026", "07/07/2026", "07/08/2026", "07/09/2026", "07/10/2026", "07/11/2026", "07/12/2026", "07/13/2026", "07/14/2026", "07/15/2026", "07/16/2026", "07/17/2026", "07/18/2026", "07/19/2026", "07/20/2026", "07/21/2026", "07/22/2026", "07/23/2026", "07/24/2026", "07/25/2026", "07/26/2026", "07/27/2026", "07/28/2026", "07/29/2026", "07/30/2026", "07/31/2026", "08/01/2026", "08/02/2026", "08/03/2026", "08/04/2026", "08/05/2026", "08/06/2026", "08/07/2026", "08/08/2026", "08/09/2026", "08/10/2026", "08/11/2026", "08/12/2026", "08/13/2026", "08/14/2026", "08/15/2026", "08/16/2026", "08/17/2026", "08/18/2026", "08/19/2026", "08/20/2026", "08/21/2026", "08/22/2026", "08/23/2026", "08/24/2026", "08/25/2026", "08/26/2026", "08/27/2026", "08/28/2026", "08/29/2026", "08/30/2026"]

# Notification channel: discord | pushover | macos | webhook | none
#
# discord (free, reliable iOS push via the Discord app):
#   1. Discord → server you control → channel settings (gear) → Integrations
#      → Webhooks → New Webhook → Copy Webhook URL
#   2. Paste it as webhook_url below and switch type to "discord".
#   3. Make sure the Discord mobile app has notifications enabled for that channel.
#
# notify:
#   type: discord
#   webhook_url: https://discord.com/api/webhooks/XXXXXXXXXX/YYYYYYYYYY

# Notification channel and any secrets (webhook URLs, tokens) live in
# secrets.local.yaml — that file is gitignored. See secrets.local.yaml.example.
notify:
  type: discord

# pushover (~$5 one-time, polished native iOS UX):
#   type: pushover
#   token: <app-token-from-pushover.net>
#   user:  <your-user-key>

# macOS desktop notification (no phone):
#   type: macos

# Generic Slack-style webhook (posts {"text": ...}):
#   type: webhook
#   webhook_url: https://hooks.slack.com/services/XXX/YYY/ZZZ
